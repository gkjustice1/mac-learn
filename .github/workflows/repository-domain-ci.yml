name: Repository Domain CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/repository-domain/**'
      - '.github/workflows/repository-domain-ci.yml'
  push:
    branches:
      - 'agent/s1-001-1-repository-domain'
      - 'agent/s1-001-2-repository-persistence'
      - 'agent/s1-001-3-repository-application-service'
      - 'agent/s1-001-4-repository-api'
    paths:
      - 'packages/repository-domain/**'
      - '.github/workflows/repository-domain-ci.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mekos_test
          POSTGRES_USER: mekos
          POSTGRES_PASSWORD: mekos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mekos -d mekos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mekos:mekos@localhost:5432/mekos_test
    defaults:
      run:
        working-directory: packages/repository-domain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate

      - name: Repository aggregate unit tests
        run: npx vitest run src/repository.test.ts

      - name: Application service unit tests
        run: npx vitest run src/repository-application-service.test.ts

      - name: Repository persistence integration tests
        run: npx vitest run src/postgres-repository.integration.test.ts

      - name: Application service PostgreSQL integration tests
        run: npx vitest run src/repository-application-service.integration.test.ts

      - name: Repository API unit and contract tests
        run: npx vitest run src/repository-api.test.ts

      - name: Repository API PostgreSQL integration tests
        run: npx vitest run src/repository-api.integration.test.ts
