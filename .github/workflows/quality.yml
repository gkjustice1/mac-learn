name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/migration-reconciliation]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.100.0

      - name: Generate ACL reconciliation migration
        if: github.ref == 'refs/heads/chore/migration-reconciliation'
        run: supabase migration new reconcile_production_acl

      - name: Upload generated ACL migration
        if: github.ref == 'refs/heads/chore/migration-reconciliation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-acl-migration
          path: supabase/migrations/*_reconcile_production_acl.sql
          if-no-files-found: error
          retention-days: 1

      - name: Start local Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Dump clean replay schema
        run: supabase db dump --local --schema public,storage --file /tmp/mac-learn-clean-replay.sql

      - name: Upload clean replay schema
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-learn-clean-replay-schema
          path: /tmp/mac-learn-clean-replay.sql
          if-no-files-found: error
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
